# Terminal Values.app. XcodeGen makes the Xcode project from this file
# (make app, make app-test); the project itself isn't kept in git.
name: TerminalValues
options:
  bundleIdPrefix: org.terminalvalues
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  # Exactly 1.11.2: later versions need the Metal toolchain (1.12+) and run a
  # build plugin, their own code at build time (1.19+).
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.11.2"
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sparkle's EdDSA public key; release.sh sets it. Without one the app
    # doesn't check for updates (a development build).
    SPARKLE_PUBLIC_KEY: ""
targets:
  TerminalValues:
    type: application
    platform: macOS
    sources:
      - path: TerminalValues
    dependencies:
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: TerminalValues/Info.plist
      properties:
        CFBundleName: Terminal Values
        CFBundleDisplayName: Terminal Values
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://github.com/terminal-values/tvbox/releases/latest/download/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_KEY)"
        LSMinimumSystemVersion: "26.0"
        # A menu bar app: no Dock icon; its window comes forward when opened.
        LSUIElement: true
        NSHumanReadableCopyright: "MIT licence"
    settings:
      base:
        PRODUCT_NAME: Terminal Values
        PRODUCT_MODULE_NAME: TerminalValues
        PRODUCT_BUNDLE_IDENTIFIER: org.terminalvalues.TerminalValues
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    postBuildScripts:
      # tv itself, from the repository, inside the app (Contents/Resources/tv).
      - name: Bundle tv
        basedOnDependencyAnalysis: false
        script: |
          install -m 755 "$SRCROOT/../tv" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/tv"
    scheme:
      testTargets: [TerminalValuesTests]
  TerminalValuesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes: [faketv]
    dependencies:
      - target: TerminalValues
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.terminalvalues.TerminalValuesTests
        GENERATE_INFOPLIST_FILE: YES
        # The app's name has a space, which the default host path misses.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Terminal Values.app/Contents/MacOS/Terminal Values"
        BUNDLE_LOADER: "$(TEST_HOST)"
